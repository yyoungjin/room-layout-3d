<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 배치안 v2</title>
<style>
  :root { --bg: #f4f1ec; --ink: #2a2622; --muted: #7a7168; --btn: #ffffff; --btn-on: #2a2622; --btn-on-ink: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161412; --ink: #efe9e1; --muted: #a59b90; --btn: #26221e; --btn-on: #efe9e1; --btn-on-ink: #161412; }
  }
  :root[data-theme="dark"] { --bg: #161412; --ink: #efe9e1; --muted: #a59b90; --btn: #26221e; --btn-on: #efe9e1; --btn-on-ink: #161412; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; }
  .bar { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); right: calc(16px + env(safe-area-inset-right)); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .bar h1 { font-size: 1.05rem; margin: 0 8px 0 0; pointer-events: auto; }
  .bar button { pointer-events: auto; border: 0; border-radius: 999px; padding: 6px 12px; font-size: .82rem;
    background: var(--btn); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); cursor: pointer; }
  .bar button.on { background: var(--btn-on); color: var(--btn-on-ink); }
  .hint { position: fixed; bottom: 12px; left: 16px; right: 16px; font-size: .78rem; color: var(--muted); pointer-events: none; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; text-align: center; }
  #c { touch-action: none; }
  .bar button { touch-action: manipulation; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  @media (max-width: 600px) {
    .bar { top: calc(8px + env(safe-area-inset-top)); left: 0; right: 0; gap: 6px; }
    .bar h1 { font-size: .95rem; width: 100%; margin: 0; padding: 0 16px; }
    .btns { width: 100%; gap: 6px; padding: 2px 16px 0; }
    .bar button { padding: 8px 12px; font-size: .8rem; }
    .hint { font-size: .72rem; bottom: calc(10px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <h1>3D 배치안 v2</h1>
  <div class="btns">
  <button data-view="iso" class="on">비스듬히</button>
  <button data-view="top">위에서</button>
  <button data-view="door">현관에서</button>
  <button data-view="bed">침대에서</button>
  <button id="walls">벽 높이: 낮게</button>
  <button id="mood" class="on">조명: 저녁</button>
  </div>
</div>
<div class="hint" id="hint">드래그: 회전 · 스크롤/핀치: 확대 · 오른쪽 드래그: 이동 · 구조 치수는 추정값</div>
<div id="err">3D를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  if (!window.THREE || !THREE.OrbitControls) { document.getElementById('err').style.display = 'flex'; return; }

  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  scene.background = new THREE.Color(dark ? 0x161412 : 0xf2f2f2);

  const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 100);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * 0.495;

  // ---------- 재질 ----------
  const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85, metalness: 0 }, o));
  const mat = {
    wall: M(0xf4f4f2), wallEdge: M(0xd6d6d4), duct: M(0xbdbdbb),
    floor: M(0x9f9c98, { roughness: 0.7 }), tile: M(0xe6e6e4), bath: M(0xdfe6e8), shower: M(0xcfdadd),
    wardrobe: M(0xf3f3f1), groove: M(0xb8b8b6), kitchen: M(0xf5f5f3), counter: M(0x8c8a86), sink: M(0x9aa1a6, { metalness: .4, roughness: .4 }), cook: M(0x222222, { roughness: .3 }),
    wood: M(0xf2f2f0, { roughness: 0.6 }), woodDk: M(0x262626, { roughness: 0.5 }), linen: M(0xefefed), white: M(0xffffff), sage: M(0x8a8a88), beige: M(0xd4d4d2),
    rug: M(0xdcdcda), black: M(0x1e1e1e, { roughness: .4 }), screen: M(0x101418, { roughness: .2, emissive: 0x0b1a2a, emissiveIntensity: .6 }),
    plant: M(0x5f8a58), pot: M(0xcfc6b8), shade: M(0xffffff, { emissive: 0xffe6b8, emissiveIntensity: .7 }),
    glass: new THREE.MeshPhysicalMaterial({ color: 0xbfe3f5, transparent: true, opacity: 0.25, roughness: 0.05 }),
    door: M(0xdcdcda), mat: M(0x5a5a5a)
  };

  // x: 가로(왼쪽 창문 0 → 오른쪽 현관 6.1), z: 세로(위 붙박이장 0 → 아래 2.75), y: 높이
  function box(x1, x2, z1, z2, y1, y2, m, parent = scene, shadow = true) {
    const g = new THREE.BoxGeometry(Math.abs(x2 - x1), Math.abs(y2 - y1), Math.abs(z2 - z1));
    const mesh = new THREE.Mesh(g, m);
    mesh.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
    mesh.castShadow = shadow; mesh.receiveShadow = true;
    parent.add(mesh); return mesh;
  }
  function cyl(x, z, r, y1, y2, m, seg = 24, r2) {
    const g = new THREE.CylinderGeometry(r2 === undefined ? r : r2, r, y2 - y1, seg);
    const mesh = new THREE.Mesh(g, m);
    mesh.position.set(x, (y1 + y2) / 2, z); mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh); return mesh;
  }

  // ---------- 실측 치수 (2026-11 실측) ----------
  // 방 안쪽 가로(아래벽) 3.524m · 왼쪽 벽 유효 2.4m(덕트 아래) · 욕실 쪽 벽 1.4m · 빌트인 ㄱ자 책상 1.4m(폭 0.5, 높이 0.76)
  // 실측 안 한 부분(덕트, 붙박이장 깊이, 주방, 욕실, 현관)은 기존 추정 비율 유지
  const RW = 3.524, D = 2.95, WT = D - 1.4;   // RW: 욕실벽 면 x, D: 아래벽 z, WT: 욕실벽 시작 z(=1.55)
  const dx = RW - 3.8;                         // 욕실·현관 쪽 구조 이동량
  const RX = 6.1 + dx;                         // 오른쪽(현관) 외벽 x
  const zb = z => WT + (z - 1.59) * (1.4 / 1.16); // 욕실 구역 z 환산

  // ---------- 바닥 ----------
  const shape = new THREE.Shape();
  [[0.9,0],[5.1+dx,0],[5.1+dx,0.3],[RX,0.3],[RX,D],[0,D],[0,0.55],[0.9,0.55]].forEach((p, i) => i ? shape.lineTo(p[0], -p[1]) : shape.moveTo(p[0], -p[1]));
  const floor = new THREE.Mesh(new THREE.ShapeGeometry(shape), mat.floor);
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  box(5.13+dx, RX, 0.3, WT, 0, 0.006, mat.tile, scene, false);
  box(4.42+dx, 5.1+dx, 0.83, 1.45, 0, 0.006, mat.tile, scene, false);
  box(RW+0.16, 5.1+dx, zb(1.65), D, 0, 0.008, mat.bath, scene, false);
  box(5.16+dx, RX, zb(1.65), zb(2.30), 0, 0.008, mat.shower, scene, false);
  box(5.16+dx, RX, zb(2.34), D, 0, 0.008, mat.bath, scene, false);

  // ---------- 벽 (높이 토글) ----------
  const FULL = 2.4, LOW = 0.45; let wallH = LOW;
  const wallGroup = new THREE.Group(); scene.add(wallGroup);
  function w(x1, x2, z1, z2, y1, y2, m = mat.wall) {
    const top = Math.min(y2, wallH); if (top <= y1) return;
    box(x1, x2, z1, z2, y1, top, m, wallGroup);
  }
  const WIN1 = 0.855, WIN2 = 2.35;             // 창문 z 범위 (왼쪽 벽 비율 유지)
  function buildWalls() {
    while (wallGroup.children.length) { const c = wallGroup.children.pop(); c.geometry.dispose(); }
    const T = 0.1;
    w(0.9, 5.2+dx, -T, 0, 0, FULL);              // 위 외벽
    w(5.1+dx, 5.2+dx, -T, 0.3, 0, FULL);
    w(5.1+dx, RX+T, 0.2, 0.3, 0, FULL);
    // 오른쪽 외벽 + 현관문 개구부 (z 0.5~1.35)
    w(RX, RX+T, 0.2, 0.5, 0, FULL); w(RX, RX+T, 1.35, D+T, 0, FULL); w(RX, RX+T, 0.5, 1.35, 2.1, FULL);
    w(-T, RX+T, D, D + T, 0, FULL);              // 아래 외벽
    // 왼쪽 외벽 + 창문 (높이 0.9~2.1)
    w(-T, 0, 0.55, WIN1, 0, FULL); w(-T, 0, WIN2, D+T, 0, FULL);
    w(-T, 0, WIN1, WIN2, 0, 0.9); w(-T, 0, WIN1, WIN2, 2.1, FULL);
    if (wallH > 0.9) { const gh = Math.min(2.1, wallH) - 0.9; const g = box(-0.05, -0.04, WIN1, WIN2, 0.9, 0.9 + gh, mat.glass, wallGroup, false); g.receiveShadow = false; }
    // 내부 벽
    w(5.07+dx, 5.13+dx, 0.3, 0.83, 0, FULL);     // 현관 칸막이
    w(RW, RW+0.16, WT, D, 0, FULL);              // 방-욕실 벽 (방 쪽 면 길이 1.4m)
    w(RW+0.16, 4.3+dx, WT, zb(1.65), 0, FULL); w(4.95+dx, 5.13+dx, WT, zb(1.65), 0, FULL); w(4.3+dx, 4.95+dx, WT, zb(1.65), 2.1, FULL);
    w(5.1+dx, 5.16+dx, WT, D, 0, FULL);          // 욕실-샤워실
    w(5.16+dx, RX, WT, zb(1.65), 0, FULL);       // 샤워실 위
    // 덕트·기둥
    w(-T, 0.9, -T, 0.55, 0, FULL, mat.duct);
    // 문
    w(RX+0.02, RX+0.06, 0.5, 1.35, 0, 2.08, mat.door);                  // 현관문 (닫힘)
    w(4.3+dx, 4.34+dx, zb(1.65), zb(2.28), 0, 2.05, mat.door);          // 욕실 문 (열림)
    if (wallH > 0.3) { const g = box(5.2+dx, RX, zb(2.30), zb(2.33), 0, Math.min(1.9, wallH), mat.glass, wallGroup, false); }
  }
  buildWalls();

  // ---------- 고정 가구 ----------
  // 붙박이장 (x 0.9 ~ 주방 시작, 깊이 0.58, 4칸)
  const KX = 3.52 + dx;                        // 주방 시작 x
  box(0.9, KX, 0, 0.58, 0, 2.3, mat.wardrobe);
  [1, 2, 3].forEach(i => { const x = 0.9 + (KX - 0.9) * i / 4; box(x - 0.006, x + 0.006, 0.58, 0.585, 0.05, 2.25, mat.groove, scene, false); });
  // 주방
  box(KX, 4.63+dx, 0, 0.6, 0, 0.85, mat.kitchen);
  box(KX, 4.63+dx, 0, 0.62, 0.85, 0.89, mat.counter);
  box(3.62+dx, 4.06+dx, 0.12, 0.48, 0.86, 0.895, mat.sink, scene, false);
  box(4.18+dx, 4.58+dx, 0.1, 0.5, 0.89, 0.9, mat.cook, scene, false);
  box(KX, 4.63+dx, 0, 0.35, 1.45, 2.2, mat.kitchen);

  // 빌트인 ㄱ자 책상 (실측): 욕실벽을 따라 1.4m(z 1.55~2.95), 폭 0.5m, 높이 0.76m
  // ㄱ자 꺾인 부분(실측): 벽 시작 쪽 끝에서 침대 쪽으로 벽에서 1.23m 튀어나옴, 깊이 0.5m(책상 폭과 동일 가정)
  const DX0 = RW - 0.5, LX0 = RW - 1.23, LZ1 = WT + 0.5;
  box(DX0, RW, WT, D, 0.72, 0.76, mat.wood);                            // 본 상판 1.4m
  box(LX0, DX0, WT, LZ1, 0.72, 0.76, mat.wood);                         // ㄱ자 상판
  box(RW - 0.06, RW, WT, D, 0, 0.72, mat.woodDk);                       // 벽쪽 판
  box(DX0, RW, D - 0.06, D, 0, 0.72, mat.woodDk);                       // 아래벽 쪽 옆판
  [[LX0 + 0.02, WT + 0.02], [LX0 + 0.02, LZ1 - 0.02]].forEach(p => box(p[0]-0.02, p[0]+0.02, p[1]-0.02, p[1]+0.02, 0, 0.72, mat.woodDk));
  box(LX0 + 0.05, RW - 0.08, WT + 0.05, LZ1 - 0.05, 0.28, 0.3, mat.wood); // 하단 선반
  box(RW - 0.15, RW, LZ1, D, 1.45, 1.48, mat.wood);                      // 벽선반 (주방 상부장 하단 1.45 라인)
  // 모니터 + 암 (본 책상 가운데, 침대 쪽으로 돌릴 수 있음)
  const MZ = (LZ1 + D) / 2;
  box(RW - 0.12, RW - 0.1, MZ - 0.17, MZ + 0.17, 0.76, 1.1, mat.black);
  const mon = box(RW - 0.2, RW - 0.18, MZ - 0.31, MZ + 0.31, 0.98, 1.34, mat.screen); mon.rotation.y = 0.35;
  cyl(RW - 0.2, WT + 0.14, 0.06, 0.76, 0.78, mat.black); cyl(RW - 0.2, WT + 0.14, 0.01, 0.78, 1.12, mat.black, 8); cyl(RW - 0.2, WT + 0.14, 0.1, 1.08, 1.18, mat.shade, 20, 0.05); // 스탠드
  box(LX0 + 0.08, LX0 + 0.38, WT + 0.08, WT + 0.4, 0.76, 0.778, mat.linen); // 노트북/서류
  // 책상 의자
  chair(DX0 - 0.3, MZ, -Math.PI / 2);

  // ---------- 통로 낮은 콘솔 선반: 욕실 문 옆 욕실 벽 ----------
  // 차키·지갑 올려두는 용도. 상판 0.76 = 책상, 하단 선반 0.30 = 책상 하단 선반
  { const c1 = RW + 0.03, c2 = RW + 0.47, cz = WT - 0.19;
    box(c1, c2, cz, WT, 0.72, 0.76, mat.wood);
    [[c1+0.02,cz+0.02],[c2-0.02,cz+0.02],[c1+0.02,WT-0.02],[c2-0.02,WT-0.02]].forEach(p => box(p[0]-0.015, p[0]+0.015, p[1]-0.015, p[1]+0.015, 0, 0.72, mat.woodDk));
    box(c1+0.01, c2-0.01, cz+0.01, WT-0.01, 0.28, 0.3, mat.wood);
    box(c1+0.06, c2-0.07, cz+0.03, WT-0.02, 0.3, 0.46, mat.beige);
    box(c1+0.05, c1+0.25, cz+0.03, WT-0.04, 0.76, 0.775, mat.woodDk);   // 트레이
    box(c1+0.07, c1+0.16, cz+0.05, cz+0.12, 0.775, 0.795, mat.black);   // 지갑
    box(c1+0.18, c1+0.22, cz+0.06, cz+0.13, 0.775, 0.795, mat.black);   // 차키
  }

  // ---------- 현관 · 주방 소품 ----------
  box(5.28+dx, 5.98+dx, 1.2, 1.44, 0, 0.015, mat.mat, scene, false);
  box(4.66+dx, 5.06+dx, 0.28, 0.62, 0, 0.89, mat.wood);                // 왜건: 카운터 상판 0.89·앞선 0.62 라인

  // ---------- 침대 (왼쪽 창가 벽, 머리는 아래벽 쪽) · 실측: 헤드 포함 길이 2.17m, 너비 1.13m, 헤드 높이 1.21m, 전체 흰색 ----------
  // 왼쪽 벽 유효 길이 2.4m(z 0.55~2.95)에 2.17m → 발치와 붙박이장 앞선 사이 약 0.2m
  const BL = 2.17, BW = 1.13, BH = 1.21, HT = 0.12;
  box(0.0, BW, D - HT, D, 0, BH, mat.white);                           // 헤드 (흰색)
  box(0.0, BW, D - BL, D - HT, 0, 0.3, mat.white);                     // 프레임(흰색)
  box(0.02, BW - 0.02, D - BL + 0.02, D - HT - 0.02, 0.3, 0.52, mat.linen); // 매트리스
  box(0.01, BW - 0.01, D - BL + 0.01, D - 0.9, 0.52, 0.56, mat.sage);  // 이불 (발치 쪽)
  box(0.18, BW - 0.18, D - HT - 0.43, D - HT - 0.08, 0.52, 0.64, mat.linen); // 베개
  [1.0, 1.47, 1.94].forEach((z, i) => box(0.02, 0.16, z, z + 0.4, 0.56, 0.9, i === 1 ? mat.sage : mat.beige)); // 창가 벽쪽 쿠션 (데이베드), 윗면 0.9 = 창턱

  // ---------- 마감선 기준 (고정 치수에서 가져옴) ----------
  // 0.76 = 빌트인 책상 상판 / 1.21 = 침대 헤드 상단 / MT = 매트리스 윗면(미실측, 0.52 가정) / 0.9 = 창턱
  const MT = 0.52;

  // ---------- 아래벽 낮은 수납 벤치 (협탁 겸용) ----------
  // 정렬: 높이 = 매트리스 윗면(MT) = 커피테이블, 시작 x = 침대 옆선(BW), 앞면 = 러그 아래 끝. 책상 의자 뒤 공간 위해 길이 0.97
  box(BW, 2.1, D - 0.4, D, 0.05, MT, mat.wood);
  box(BW, 2.1, D - 0.4, D, 0, 0.05, mat.woodDk);                       // 걸레받이
  [1.455, 1.78].forEach(x => box(x - 0.004, x + 0.004, D - 0.405, D - 0.4, 0.08, MT - 0.03, mat.groove, scene, false)); // 서랍 분할선
  cyl(1.32, D - 0.2, 0.06, MT, MT + 0.02, mat.black); cyl(1.32, D - 0.2, 0.01, MT + 0.02, MT + 0.36, mat.black, 8); cyl(1.32, D - 0.2, 0.1, MT + 0.32, MT + 0.42, mat.shade, 20, 0.05); // 머리맡 조명
  box(1.6, 1.95, D - 0.3, D - 0.07, MT, MT + 0.06, mat.linen);         // 책·소품

  // ---------- 1.21 라인: 침대 헤드 윗선을 아래벽 따라 책상 옆판까지 잇는 액자 선반 (깊이 9cm) ----------
  box(BW, DX0, D - 0.09, D, BH - 0.03, BH, mat.wood);
  box(BW, DX0, D - 0.09, D - 0.075, BH, BH + 0.02, mat.woodDk);       // 앞턱 (선을 또렷하게)
  [[1.5, 0.42, 0.3], [2.05, 0.3, 0.38]].forEach(([x, w, h]) => {        // 기대 놓은 액자 2개
    box(x, x + w, D - 0.05, D - 0.02, BH, BH + h, mat.woodDk);
    box(x + 0.03, x + w - 0.03, D - 0.055, D - 0.05, BH + 0.03, BH + h - 0.03, mat.linen, scene, false);
  });

  // ---------- 가운데: 러그 · 커피테이블 ----------
  // 붙박이장 앞 z 0.58~1.2 는 문 여닫이 공간으로 비움
  // 러그 네 변: 왼쪽 = 침대 옆선, 오른쪽 = ㄱ자 책상 끝선, 위 = 붙박이장 문 여닫이 끝(0.58+0.6), 아래 = 벤치 앞면
  box(BW, LX0, 1.18, D - 0.4, 0, 0.012, mat.rug, scene, false);
  cyl(1.72, 1.8, 0.27, MT - 0.03, MT, mat.wood, 32);                   // 원형 커피테이블 상판 (= 매트리스·벤치 높이)
  cyl(1.72, 1.8, 0.03, 0, MT - 0.03, mat.woodDk, 12);
  cyl(1.72, 1.8, 0.16, 0, 0.02, mat.woodDk, 24);

  function chair(x, z, rot) {
    const g = new THREE.Group();
    const add = (x1,x2,z1,z2,y1,y2,m) => box(x1,x2,z1,z2,y1,y2,m,g);
    add(-0.22, 0.22, -0.22, 0.22, 0.44, 0.49, mat.woodDk);
    add(-0.22, 0.22, 0.18, 0.22, 0.49, 0.9, mat.woodDk);
    add(-0.025, 0.025, -0.025, 0.025, 0.08, 0.44, mat.black);
    add(-0.22, 0.22, -0.02, 0.02, 0.04, 0.07, mat.black);
    add(-0.02, 0.02, -0.22, 0.22, 0.04, 0.07, mat.black);
    g.position.set(x, 0, z); g.rotation.y = rot; scene.add(g);
  }

  // ---------- 조명 ----------
  scene.add(new THREE.HemisphereLight(0xffffff, 0x808080, 0.65));
  const sun = new THREE.DirectionalLight(0xfff1dc, 0.9);
  sun.position.set(-4, 5, 1.4); sun.target.position.set(2.5, 0, 1.6);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 20 });
  sun.shadow.bias = -0.0005;
  scene.add(sun, sun.target);
  const warm2 = new THREE.PointLight(0xffc98a, 0.35, 2.2); warm2.position.set(1.32, 0.97, 2.75); scene.add(warm2);


  const MOOD = {
    lamps: [
      { p: [RW - 0.2, 1.1, WT + 0.14], eve: 1, night: 0, shadow: true },   // ㄱ자 책상 스탠드
      { p: [1.32, MT + 0.35, D - 0.2], eve: 0.8, night: 0.5, shadow: true }    // 머리맡 조명 (밤에는 이것만 은은하게)
    ],
    leds: [
      { box: [3.56+dx, 4.59+dx, 0.31, 0.34, 1.43, 1.445], lights: [[3.8+dx, 1.38, 0.4], [4.35+dx, 1.38, 0.4]], eve: 0.55, night: 0 },        // 주방 상부장 아래
      { lights: [[RW - 0.04, 1.16, MZ]], eve: 0.5, night: 0, range: 1.0 },                                                       // 모니터 뒤 벽 (바이어스 라이트)
      { box: [1.14, KX - 0.02, 0.585, 0.6, 0.008, 0.022], lights: [[1.5, 0.08, 0.72], [2.2, 0.08, 0.72], [2.9, 0.08, 0.72]], eve: 0.3, night: 0.1, range: 0.9 }, // 붙박이장 하부 띠
      { box: [BW, BW + 0.015, D - 2.1, D - 0.2, 0.012, 0.026], lights: [[1.25, 0.07, D - 1.65], [1.25, 0.07, D - 0.7]], eve: 0.35, night: 0.3, range: 1.0 }, // 침대 하부 간접등
      { box: [1.16, 2.08, D - 0.42, D - 0.405, 0.012, 0.026], lights: [[1.6, 0.07, D - 0.55]], eve: 0.25, night: 0.12, range: 0.9 }            // 벤치 하부 간접등
    ]
  };
  // ---------- 분위기 조명 (낮 / 저녁 / 밤) ----------
  const hemi = scene.children.find(o => o.isHemisphereLight);
  const dayBg = scene.background.clone();
  const moon = new THREE.DirectionalLight(0x9fb4ff, 0); moon.position.set(-4, 3, 1.4); moon.target.position.set(2, 0, 1.6); scene.add(moon, moon.target);
  const ledMat = () => new THREE.MeshStandardMaterial({ color: 0xfff0dc, emissive: 0xffb15e, emissiveIntensity: 0 });
  // 스탠드 조명: 전구 위치에 따뜻한 포인트 라이트 + 갓 발광
  const lamps = MOOD.lamps.map(l => {
    const L = new THREE.PointLight(0xffb066, 0, 5, 2); L.position.set(...l.p);
    if (l.shadow) { L.castShadow = true; L.shadow.mapSize.set(512, 512); L.shadow.camera.near = 0.05; L.shadow.bias = -0.003; }
    scene.add(L); return { l, L, shades: [] };
  });
  scene.traverse(o => {
    if (!o.isMesh || o.material !== mat.shade) return;
    o.material = mat.shade.clone(); o.castShadow = false;
    let best = null, bd = 1e9;
    lamps.forEach(k => { const d = Math.hypot(k.l.p[0] - o.position.x, k.l.p[2] - o.position.z); if (d < bd) { bd = d; best = k; } });
    if (best && bd < 0.3) best.shades.push(o);
  });
  // 간접조명(LED 스트립): 발광 띠 + 낮은 포인트 라이트
  const leds = MOOD.leds.map(d => {
    let strip = null;
    if (d.box) { const [x1, x2, z1, z2, y1, y2] = d.box; strip = box(x1, x2, z1, z2, y1, y2, ledMat(), scene, false); }
    const Ls = d.lights.map(p => { const L = new THREE.PointLight(0xffb873, 0, (d.range || 1.3) * 1.4, 2); L.position.set(...p); scene.add(L); return L; });
    return { d, strip, Ls };
  });
  const MODES = [
    { name: '낮' }, { name: '저녁' }, { name: '밤' }
  ];
  let mood = 0;
  function setMood(m) {
    mood = m; const day = m === 0, eve = m === 1;
    hemi.intensity = day ? 0.65 : eve ? 0.09 : 0.03;
    hemi.color.set(day ? 0xffffff : 0x7f8db3); hemi.groundColor.set(day ? 0x808080 : 0x3b2d22);
    sun.intensity = day ? 0.9 : 0; moon.intensity = day ? 0 : eve ? 0.06 : 0.04;
    warm2.intensity = day ? 0.35 : 0;
    lamps.forEach(k => {
      const v = day ? 0 : eve ? (k.l.eve ?? 1) : (k.l.night || 0);
      k.L.intensity = v * 2.6;
      k.shades.forEach(s => { s.material.emissiveIntensity = v > 0 ? 0.6 + v : 0; s.material.emissive.set(0xffc27a); });
    });
    leds.forEach(e => {
      const v = day ? 0 : eve ? e.d.eve : e.d.night;
      e.Ls.forEach(L => L.intensity = v * 2.2);
      if (e.strip) e.strip.material.emissiveIntensity = v > 0 ? 1.2 + v : 0;
    });
    mat.screen.emissiveIntensity = day ? 0.6 : eve ? 1.2 : 0.05;
    scene.background = day ? dayBg : new THREE.Color(eve ? 0x0d0f15 : 0x06070a);
    mb.textContent = '조명: ' + MODES[m].name;
    mb.classList.toggle('on', m !== 0);
  }
  const mb = document.getElementById('mood');
  mb.addEventListener('click', () => setMood((mood + 1) % 3));
  setMood(+(new URLSearchParams(location.search).get('mood') ?? 1));   // 기본: 저녁

  // ---------- 시점 ----------
  const views = {
    iso:  { p: [2.9, 6.6, 6.6], t: [2.9, 0.2, 1.35] },
    top:  { p: [2.9, 8.6, 1.48], t: [2.9, 0, 1.47] },
    door: { p: [5.3, 1.6, 0.9],  t: [1.4, 0.9, 1.75] },
    bed:  { p: [0.55, 1.05, 2.5], t: [3.3, 0.9, 1.9] }
  };

  // 세로 화면(모바일)용 시점: 방의 긴 축(6.1m)이 화면 세로로 오도록
  const viewsPortrait = {
    iso: { p: [10.3, 7.4, 5.4], t: [2.9, 0.1, 1.55] },
    top: { p: [2.91, 7.4, 1.47], t: [2.9, 0, 1.47] }
  };
  let curView = 'iso', wasPortrait = null;
  const isPortrait = () => camera.aspect < 0.85;
  const pick = name => (isPortrait() && viewsPortrait[name]) || views[name];
  let anim = null;
  // 둘러보기 모드: '현관에서'·'침대에서' 시점은 서 있는 자리(카메라 위치)를 중심으로 고개를 돌리듯 회전
  let lookMode = false;
  function setLook(on) {
    lookMode = on;
    controls.rotateSpeed = on ? -0.45 : 1;       // 화면을 잡아 끄는 방향으로 시선이 따라오게
    controls.enableZoom = !on; controls.enablePan = !on;
    controls.minPolarAngle = on ? Math.PI * 0.1 : 0;
    controls.maxPolarAngle = on ? Math.PI * 0.9 : Math.PI * 0.495;
    if (on) { const d = new THREE.Vector3(); camera.getWorldDirection(d); controls.target.copy(camera.position).addScaledVector(d, 0.05); controls.update(); }
  }
  canvas.addEventListener('wheel', e => {          // 둘러보기 모드에서는 휠로 화각(줌)만 조절
    if (!lookMode) return; e.preventDefault();
    camera.fov = Math.min(80, Math.max(25, camera.fov + Math.sign(e.deltaY) * 3)); camera.updateProjectionMatrix();
  }, { passive: false });
  function go(name, instant) {
    const v = pick(name); curView = name; setLook(false);
    const fromP = camera.position.clone(), fromT = controls.target.clone();
    const toP = new THREE.Vector3(...v.p), toT = new THREE.Vector3(...v.t);
    if (instant) { camera.position.copy(toP); controls.target.copy(toT); controls.update(); return; }
    const t0 = performance.now();
    anim = () => { const now = performance.now();
      let k = Math.min(1, (now - t0) / 700); k = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
      camera.position.lerpVectors(fromP, toP, k); controls.target.lerpVectors(fromT, toT, k);
      if (k >= 1) { anim = null; if (name === 'door' || name === 'bed') setLook(true); }
    };
  }
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x === b));
    if ((b.dataset.view === 'door' || b.dataset.view === 'bed') && wallH < FULL) setWalls(FULL);
    go(b.dataset.view);
  }));
  const wb = document.getElementById('walls');
  function setWalls(h) { wallH = h; buildWalls(); wb.textContent = '벽 높이: ' + (h < FULL ? '낮게' : '실제'); }
  wb.addEventListener('click', () => setWalls(wallH < FULL ? FULL : LOW));

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w < 600 ? 60 : 45; camera.updateProjectionMatrix();
    if (wasPortrait !== null && isPortrait() !== wasPortrait) go(curView, true);
    wasPortrait = isPortrait();
  }
  window.addEventListener('resize', resize); resize();
  go('iso', true);
  if (matchMedia('(pointer: coarse)').matches) document.getElementById('hint').textContent = '한 손가락: 회전 · 두 손가락: 확대/이동 · 치수는 추정값';

  renderer.setAnimationLoop((now) => { if (anim) anim(now); controls.update(); renderer.render(scene, camera); });
})();
</script>
</body>
</html>
