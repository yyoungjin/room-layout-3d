<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>평면도 v3</title>
<style>
  :root {
    --bg: #f4f4f2; --card: #ffffff; --ink: #1e1e1e; --muted: #77746f; --line: #c9c7c3;
    --wall: #2b2b2b; --floor: #e7e4df; --tile: #d9dbdc; --bath: #dfe6e8; --shower: #cfdadd;
    --built: #f3f3f1; --furn: #ffffff; --dark: #2b2b2b; --rug: #d8d6d2; --zone: rgba(120,120,120,.10);
    --bed: #fbfbfa; --blanket: #c9c9c6; --cushion: #a9a9a6; --lamp: #ffd9a0; --accent: #c0612b; --gap: #4a7fb0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121315; --card: #1b1d21; --ink: #ecebe8; --muted: #9b978f; --line: #4a4d53;
      --wall: #d9d7d2; --floor: #2a2b2e; --tile: #33373a; --bath: #263236; --shower: #213036;
      --built: #3a3c40; --furn: #46484d; --dark: #0e0e0f; --rug: #3b3c3f; --zone: rgba(200,200,200,.07);
      --bed: #505257; --blanket: #66686d; --cushion: #7d7f84; --lamp: #e8b56a; --accent: #f0915a; --gap: #7fb3e0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121315; --card: #1b1d21; --ink: #ecebe8; --muted: #9b978f; --line: #4a4d53;
    --wall: #d9d7d2; --floor: #2a2b2e; --tile: #33373a; --bath: #263236; --shower: #213036;
    --built: #3a3c40; --furn: #46484d; --dark: #0e0e0f; --rug: #3b3c3f; --zone: rgba(200,200,200,.07);
    --bed: #505257; --blanket: #66686d; --cushion: #7d7f84; --lamp: #e8b56a; --accent: #f0915a; --gap: #7fb3e0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 32px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
  .card { background: var(--card); border-radius: 14px; padding: 12px; overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 560px; height: auto; }
  .floor { fill: var(--floor); } .tile { fill: var(--tile); } .bath { fill: var(--bath); } .shower { fill: var(--shower); }
  .rug { fill: var(--rug); } .zone { fill: var(--zone); stroke: var(--line); stroke-dasharray: 4 4; }
  .duct { fill: var(--wall); opacity: .55; }
  .built { fill: var(--built); stroke: var(--line); } .furn { fill: var(--furn); stroke: var(--line); }
  .thin { stroke: var(--line); } .sink { fill: none; stroke: var(--line); } .hob { fill: none; stroke: var(--line); }
  .mat { fill: var(--cushion); opacity: .6; }
  .bed { fill: var(--bed); stroke: var(--line); } .head { fill: var(--bed); stroke: var(--ink); stroke-width: 1.2; }
  .pillow { fill: var(--card); stroke: var(--line); } .blanket { fill: var(--blanket); opacity: .55; }
  .cushion { fill: var(--cushion); } .basket { fill: none; stroke: var(--muted); }
  .dark { fill: var(--dark); } .chair { fill: var(--dark); opacity: .85; } .lamp { fill: var(--lamp); stroke: var(--dark); }
  .wall { fill: var(--wall); } .window { fill: var(--card); } .gap { fill: var(--floor); }
  .glass { stroke: var(--gap); stroke-width: 2.5; } .door { stroke: var(--wall); stroke-width: 2; }
  .swing { fill: none; stroke: var(--muted); stroke-dasharray: 3 3; }
  .lbl { fill: var(--ink); font-size: 12px; } .lbl.small { font-size: 10.5px; fill: var(--muted); } .mid { text-anchor: middle; }
  line.dim { stroke: var(--muted); stroke-width: 1; } line.dim.m { stroke: var(--accent); } line.dim.gap { stroke: var(--gap); }
  .dimt { font-size: 10.5px; text-anchor: middle; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .dimt.m { fill: var(--accent); font-weight: 600; } .dimt.gap { fill: var(--gap); font-weight: 600; }
  .note { margin: 12px 4px 0; color: var(--muted); font-size: .82rem; line-height: 1.5; }
  .note b { color: var(--accent); font-weight: 600; } .note i { color: var(--gap); font-style: normal; font-weight: 600; }
</style>
</head>
